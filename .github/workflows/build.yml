
name: Build NoAnimationX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== PROJECT FILES ==="
          find . -maxdepth 5 -type f | sort

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          test -f settings.gradle
          test -f build.gradle
          gradle build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoAnimationX-JAR
          path: build/libs/*.jar
