
name: Build NoAnimationX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project
        run: |
          echo "Checking NoAnimationX project..."
          ls -la NoAnimationX/NoAnimationX
          test -f NoAnimationX/NoAnimationX/build.gradle
          test -f NoAnimationX/NoAnimationX/settings.gradle

      - name: Build mod
        working-directory: NoAnimationX/NoAnimationX
        run: gradle build --stacktrace

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoAnimationX-JAR
          path: NoAnimationX/NoAnimationX/build/libs/*.jar
